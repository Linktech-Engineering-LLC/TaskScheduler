TaskScheduler:
  config_version: 1.0.0
  mode: developer
  features:
    cron:
      enabled: true
      editable: true
      columns:
        - Schedule
        - Command
        - Status
        - Comment
      readonly: true
      stretch_last: true
      autosize: true
      status_labels:
        enabled: "enabled"
        disabled: "disabled"

    systemd:
      enabled: true
      editable: true
      columns:
        - Unit
        - Description
        - Active
        - Loaded
      readonly: true
      stretch_last: true
      autosize: true
      status_labels:
        active: "active"
        inactive: "inactive"

    env_manager:
      enabled: true
      editable: true
      columns:
        - Variable
        - Value
        - Scope
      readonly: false
      stretch_last: true
      autosize: true
    log_viewer: true
    alias_detection: true

  gui:
    theme: dark
    grid_layout: KCron
    editable_fields:
      - gui.theme
      - gui.grid_layout
      - logs.max_lines
      - logs.highlight_patterns

  safety:
    warn_on_alias: true
    warn_on_relative_paths: true
    validate_before_save: true
    require_explicit_path: true

  install:
    mode: base
    portable_root: null
paths:
  config_root: ~/.config/taskscheduler
  data_root: ~/.local/share/taskscheduler
  temp_root: ~/.cache/taskscheduler
  export_root: ~/exports
  portable_root: null
  plugins: ~/.local/share/taskscheduler/plugins
  backups: ~/backups/taskscheduler
