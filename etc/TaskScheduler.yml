TaskScheduler:
  config_version: 1.0.0
  mode: developer
  features:
    cron:
      enabled: true
      editable: true
      columns:
        - Schedule
        - Command
        - Status
        - Comment
      readonly: true
      stretch_last: true
      autosize: true
      status_labels:
        enabled: "enabled"
        disabled: "disabled"

    systemd:
      enabled: true
      editable: true
      columns:
        - Unit
        - Description
        - Active
        - Loaded
      readonly: true
      stretch_last: true
      autosize: true
      status_labels:
        active: "active"
        inactive: "inactive"

    env_manager:
      enabled: true
      editable: true
      columns:
        - Variable
        - Value
        - Scope
      readonly: false
      stretch_last: true
      autosize: true
    log_viewer: true
    alias_detection: true

  gui:
    theme: dark
    grid_layout: KCron
    editable_fields:
      - gui.theme
      - gui.grid_layout
      - logs.max_lines
      - logs.highlight_patterns

  safety:
    warn_on_alias: true
    warn_on_relative_paths: true
    validate_before_save: true
    require_explicit_path: true

  install:
    mode: base
    portable_root: null
logs:
  console_enabled: true
  color_enabled: true
  level: DEBUG
  path: ~/logs
  timestamp_format: "%Y-%m-%d %H:%M:%S"
  max_lines: 500
  highlight_patterns:
    - ERROR
    - WARN
    - FAILED
  include_stack_traces: false
  rotation:
    enabled: true
    max_size_mb: 5
    max_files: 10
    compress: true
    archive_type: tar.gz
  archive:
    enabled: true
    path: ~/logs/archive
    compress: true
  retention:
    days: 30
  subsystems:
    cron: true
    systemd: true
    environment: true
    internal: true
  gui:
    default_view: task_scheduler
    allow_path_edit: true
