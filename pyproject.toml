[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TaskScheduler"
version = "0.0.3"
description = "GUI Manager for SystemD/Cron Events."
authors = [
    { name = "Leon McClatchey", email = "ldmcclatchey@linktech.engineering" }
]
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "PySide6>=6.7",
]

[project.scripts]
# Optional: if you want a CLI entry point
TaskScheduler = "TaskScheduler.TaskScheduler:main"

[tool.setuptools.packages.find]
exclude = ["data*", "Logs*", "archive*"]
include = ["TaskScheduler"]
